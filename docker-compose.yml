services:
  portfolio:
    image: ${DOCKERHUB_USER}/portfolio-nextjs:${TAG:-v1}
    container_name: portfolio-nextjsback
    ports:
      - "3001:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5